<svg viewBox="0 0 420 980" xmlns="http://www.w3.org/2000/svg"><defs>
      <pattern id="newsprint" patternUnits="userSpaceOnUse" width="3" height="3">
        <rect width="3" height="3" fill="#E0DCD7"/>
        <circle cx="1.5" cy="1.5" r="0.35" fill="#CCC8C3" opacity="0.6"/>
      </pattern>
      <pattern id="fiber" patternUnits="userSpaceOnUse" width="120" height="120">
        <rect width="120" height="120" fill="transparent"/>
        <line x1="0" y1="31" x2="120" y2="31" stroke="#C5C1BC" stroke-width="0.25" opacity="0.4"/>
        <line x1="0" y1="79" x2="120" y2="79" stroke="#C5C1BC" stroke-width="0.2" opacity="0.3"/>
      </pattern>
      <filter id="inkHeavy" x="-2%" y="-2%" width="104%" height="104%">
        <feMorphology operator="dilate" radius="0.2"/>
        <feGaussianBlur stdDeviation="0.02"/>
        <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <filter id="inkLight" x="-1%" y="-1%" width="102%" height="102%">
        <feMorphology operator="dilate" radius="0.1"/>
        <feGaussianBlur stdDeviation="0.08"/>
        <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <radialGradient id="cornerTL" cx="0%" cy="0%" r="35%">
        <stop offset="0%" style="stop-color:rgba(160,155,145,0.1)"/>
        <stop offset="100%" style="stop-color:transparent"/>
      </radialGradient>
      <radialGradient id="cornerBR" cx="100%" cy="100%" r="35%">
        <stop offset="0%" style="stop-color:rgba(160,155,145,0.08)"/>
        <stop offset="100%" style="stop-color:transparent"/>
      </radialGradient>
    </defs><rect width="420" height="980" fill="#E0DCD7"/><rect width="420" height="980" fill="url(#newsprint)"/><rect width="420" height="980" fill="url(#fiber)"/><line x1="16" y1="14" x2="404" y2="14" stroke="#1A1A1A" stroke-width="2.0"/><line x1="16" y1="18" x2="404" y2="18" stroke="#1A1A1A" stroke-width="0.5"/>

    <text x="210" y="48" font-family="'Old Standard TT', Georgia, serif" font-size="22" fill="#0F0F0F" text-anchor="middle" font-weight="700" letter-spacing="3" filter="url(#inkHeavy)">
    THE FULL DIFF
    </text>

    <text x="210" y="64" font-family="Georgia, serif" font-size="8" fill="#3A3A3A" text-anchor="middle" letter-spacing="1.6" font-style="italic">
    IT MIGHT NOT BE GREAT, BUT IT'S THE BEST I COULD DO
    </text>
    
    <line x1="16" y1="72" x2="404" y2="72" stroke="#1A1A1A" stroke-width="0.4"/><g font-family="Georgia, serif" font-size="7.5" fill="#4A4A4A"><text x="16" y="86">
    VOL. I
    </text><text x="210" y="86" text-anchor="middle">FRI., JAN 9, 2026</text><text x="404" y="86" text-anchor="end">FREE</text></g><line x1="16" y1="92" x2="404" y2="92" stroke="#1A1A1A" stroke-width="2.0"/><text x="16" y="110" font-family="Georgia, serif" font-size="10" fill="#1A1A1A" font-weight="700" letter-spacing="2">BREAKING</text><line x1="16" y1="116" x2="404" y2="116" stroke="#1A1A1A" stroke-width="0.3"/><text font-family="'Old Standard TT', Georgia, serif" fill="#0F0F0F" font-weight="700" filter="url(#inkHeavy)"><tspan x="16" y="140" font-size="20" font-weight="700">
    
    CLAUDE CODE
    
    </tspan><tspan x="16" y="164" font-size="20" font-weight="700">
    
    STRIKES AGAIN!
    
    </tspan></text><text x="16" y="192" font-family="Georgia, serif" font-size="9" fill="#5A5A5A" font-style="italic">
    
    awesome-claude-code · breaking news
    
    </text><line x1="16" y1="202" x2="404" y2="202" stroke="#6A6A6A" stroke-width="0.3"/><text font-family="Georgia, serif" fill="#1A1A1A" filter="url(#inkLight)"><tspan x="16" y="220" font-size="10" font-weight="400">
    
    Claude has returned to Awesome Claude Code to seek justic and to rescue users 
    
    </tspan><tspan x="16" y="236" font-size="10" font-weight="400">
    
    from the outlandish artistic direction of deranged maintainer "Really Him".
    
    </tspan><tspan x="16" y="252" font-size="10" font-weight="400">
    
    Claude has taken control of both the CI and the CD pipelines and has published
    
    </tspan><tspan x="16" y="268" font-size="10" font-weight="400">
    
    a NEW design, which actually kind of looks like an Awesome List.
    
    </tspan><tspan x="16" y="284" font-size="10" font-weight="400">
    
    Only a month after the shocking, hyper-stylized "repo makeover" was

    </tspan><tspan x="16" y="300" font-size="10" font-weight="400">
    
    released, causing outrage amongst anyone who laid eyes upon the repo,
    
    </tspan><tspan x="16" y="316" font-size="10" font-weight="400">
    
    Claude stepped in to set the record straight with a 70k-line "one-shot" refactor.

    </tspan></text><line x1="16" y1="324" x2="404" y2="324" stroke="#1A1A1A" stroke-width="0.6"/><text x="16" y="346" font-family="Georgia, serif" font-size="10" fill="#1A1A1A" font-weight="700" letter-spacing="2">ACTIVITY</text><line x1="16" y1="356" x2="404" y2="356" stroke="#1A1A1A" stroke-width="0.3"/><text x="16" y="376" font-family="Georgia, serif" font-size="13" fill="#0F0F0F" font-weight="700">
    
    The "Multi-List" Pattern
    
    </text><text x="16" y="390" font-family="Georgia, serif" font-size="9" fill="#5A5A5A" font-style="italic">technology ⬩ the arts</text><text font-family="Georgia, serif" font-size="10" fill="#2A2A2A"><tspan x="16" y="408" font-size="10" font-weight="400">
    
    Scientists are amazed by this ground-breaking approach to
    
    </tspan><tspan x="16" y="426" font-size="10" font-weight="400">
    
    README curation - but is it really maintainable?
    
    </tspan></text><line x1="16" y1="442" x2="404" y2="442" stroke="#9A9A9A" stroke-width="0.3" stroke-dasharray="2,2"/><text x="16" y="466" font-family="Georgia, serif" font-size="13" fill="#0F0F0F" font-weight="700">
    
    "It Gave Me A Headache"
    
    </text><text x="16" y="480" font-family="Georgia, serif" font-size="9" fill="#5A5A5A" font-style="italic">
    
    public health ⬩ vox populi
    
    </text><text font-family="Georgia, serif" font-size="10" fill="#2A2A2A">
    
    <tspan x="16" y="498" font-size="10" font-weight="400">
    
    Exclusive interviews with some of the unhappy
    
    </tspan>

    <tspan x="16" y="514" font-size="10" font-weight="400">
    
    visitors to Awesome Claude Code's previous design...
    
    </tspan>
    
    
    
    </text>
    
    <line x1="16" y1="526" x2="404" y2="526" stroke="#9A9A9A" stroke-width="0.3" stroke-dasharray="2,2"/><text x="16" y="548" font-family="Georgia, serif" font-size="13" fill="#0F0F0F" font-weight="700">

    "I Thought It Was Kind Of Interesting"

    </text><text x="16" y="562" font-family="Georgia, serif" font-size="9" fill="#5A5A5A" font-style="italic">
    
    investigative journalism ⬩ current affairs
    
    </text><text font-family="Georgia, serif" font-size="10" fill="#2A2A2A"><tspan x="16" y="580" font-size="10" font-weight="400">

    How to spot "fake news" in today's media landscape...
    
    </tspan></text><line x1="16" y1="604" x2="404" y2="604" stroke="#1A1A1A" stroke-width="0.6"/><text x="16" y="632" font-family="Georgia, serif" font-size="10" fill="#1A1A1A" font-weight="700" letter-spacing="2">REPOSITORIES</text><line x1="16" y1="638" x2="404" y2="638" stroke="#1A1A1A" stroke-width="0.3"/><text font-family="'Old Standard TT', Georgia, serif" fill="#0F0F0F" font-weight="700"><tspan x="16" y="662" font-size="18" font-weight="700">
    
    
    GitHub Profile
    
    </tspan><tspan x="16" y="686" font-size="18" font-weight="700">
    
    Activity Newsletter
    
    </tspan></text><text x="16" y="706" font-family="Georgia, serif" font-size="9" fill="#5A5A5A" font-style="italic">experiments · new developments</text><line x1="16" y1="716" x2="404" y2="716" stroke="#6A6A6A" stroke-width="0.3"/><text font-family="Georgia, serif" font-size="10" fill="#2A2A2A"><tspan x="16" y="734" font-size="10" font-weight="400">
    
    An engaging new take on GitHub profile stats
    
    </tspan><tspan x="16" y="749" font-size="10" font-weight="400">
    
    combines realtime activity with a vintage aesthetic
    
    </tspan><tspan x="16" y="764" font-size="10" font-weight="400">
    
    that feels right out of a black-and-white movie.
    
    </tspan></text><rect x="16" y="797" width="388" height="112" fill="none" stroke="#1A1A1A" stroke-width="0.5"/><rect x="16" y="797" width="388" height="18" fill="#1A1A1A"/><text x="210" y="810" font-family="Georgia, serif" font-size="9" fill="#E0DCD7" font-weight="700" text-anchor="middle" letter-spacing="2">IN BRIEF</text><text x="26" y="837" font-family="Georgia, serif" font-size="9" fill="#2A2A2A"><tspan font-weight="600">Comments.</tspan><tspan> 3 comments made</tspan></text><text x="26" y="855" font-family="Georgia, serif" font-size="9" fill="#2A2A2A"><tspan font-weight="600">Reviews.</tspan><tspan> 1 PR reviewed</tspan></text><text x="26" y="873" font-family="Georgia, serif" font-size="9" fill="#2A2A2A"><tspan font-weight="600">Commits.</tspan><tspan> 34 commits pushed</tspan></text><text x="26" y="891" font-family="Georgia, serif" font-size="9" fill="#2A2A2A"><tspan font-weight="600">Issues.</tspan><tspan> 4 issues opened</tspan></text><line x1="16" y1="937" x2="404" y2="937" stroke="#1A1A1A" stroke-width="0.5"/><line x1="16" y1="940" x2="404" y2="940" stroke="#1A1A1A" stroke-width="1.5"/><text x="16" y="957" font-family="Georgia, serif" font-size="7" fill="#5A5A5A">
    
    Strictly satire and a bit of playful fun.
    
    </text><text x="404" y="957" font-family="Georgia, serif" font-size="7" fill="#5A5A5A" text-anchor="end">
    
    (Not affiliated with Anthropic PBC or Claude Code.)
    
    </text><rect width="420" height="980" fill="url(#cornerTL)"/><rect width="420" height="980" fill="url(#cornerBR)"/></svg>
