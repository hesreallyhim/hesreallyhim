<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 420 980" xmlns="http://www.w3.org/2000/svg"><defs>
      <pattern id="newsprint" patternUnits="userSpaceOnUse" width="3" height="3">
        <rect width="3" height="3" fill="#E0DCD7"/>
        <circle cx="1.5" cy="1.5" r="0.35" fill="#CCC8C3" opacity="0.6"/>
      </pattern>
      <pattern id="fiber" patternUnits="userSpaceOnUse" width="120" height="120">
        <rect width="120" height="120" fill="transparent"/>
        <line x1="0" y1="31" x2="120" y2="31" stroke="#C5C1BC" stroke-width="0.25" opacity="0.4"/>
        <line x1="0" y1="79" x2="120" y2="79" stroke="#C5C1BC" stroke-width="0.2" opacity="0.3"/>
      </pattern>
      <filter id="inkHeavy" x="-2%" y="-2%" width="104%" height="104%">
        <feMorphology operator="dilate" radius="0.2"/>
        <feGaussianBlur stdDeviation="0.25"/>
        <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <filter id="inkLight" x="-1%" y="-1%" width="102%" height="102%">
        <feMorphology operator="dilate" radius="0.1"/>
        <feGaussianBlur stdDeviation="0.15"/>
        <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <radialGradient id="cornerTL" cx="0%" cy="0%" r="35%">
        <stop offset="0%" style="stop-color:rgba(160,155,145,0.1)"/>
        <stop offset="100%" style="stop-color:transparent"/>
      </radialGradient>
      <radialGradient id="cornerBR" cx="100%" cy="100%" r="35%">
        <stop offset="0%" style="stop-color:rgba(160,155,145,0.08)"/>
        <stop offset="100%" style="stop-color:transparent"/>
      </radialGradient>
    </defs><rect width="420" height="980" fill="#E0DCD7"/><rect width="420" height="980" fill="url(#newsprint)"/><rect width="420" height="980" fill="url(#fiber)"/><line x1="16" y1="14" x2="404" y2="14" stroke="#1A1A1A" stroke-width="2.0"/><line x1="16" y1="18" x2="404" y2="18" stroke="#1A1A1A" stroke-width="0.5"/><text x="210" y="48" font-family="'Old Standard TT', Georgia, serif" font-size="22" fill="#0F0F0F" text-anchor="middle" font-weight="700" letter-spacing="3" filter="url(#inkHeavy)">THE FULL DIFF</text><text x="210" y="64" font-family="Georgia, serif" font-size="10" fill="#3A3A3A" text-anchor="middle" letter-spacing="1.6" font-style="italic">IT MIGHT NOT BE GREAT, BUT MY PARENTS ARE PROUD OF ME</text><line x1="16" y1="72" x2="404" y2="72" stroke="#1A1A1A" stroke-width="0.4"/><g font-family="Georgia, serif" font-size="10" fill="#4A4A4A"><text x="16" y="86">VOL. I</text><text x="210" y="86" text-anchor="middle">TUE., JAN 20, 2026</text><text x="404" y="86" text-anchor="end">FREE</text></g><line x1="16" y1="92" x2="404" y2="92" stroke="#1A1A1A" stroke-width="2.0"/><text x="16" y="110" font-family="Georgia, serif" font-size="12" fill="#1A1A1A" font-weight="700" letter-spacing="2">BREAKING NEWS</text><line x1="16" y1="116" x2="404" y2="116" stroke="#1A1A1A" stroke-width="0.3"/><text font-family="'Old Standard TT', Georgia, serif" fill="#0F0F0F" font-weight="700"><tspan x="16" y="140" font-size="20" font-weight="700">SO LONG RALPH WIGGUM,</tspan><tspan x="16" y="164" font-size="20" font-weight="700">HELLO GUY PEARCE</tspan></text><text x="16" y="192" font-family="Georgia, serif" font-size="12" fill="#5A5A5A" font-style="italic">breakthrough discovery</text><line x1="16" y1="202" x2="404" y2="202" stroke="#6A6A6A" stroke-width="0.3"/><text font-family="Georgia, serif" fill="#1A1A1A"><tspan x="16" y="220" font-size="12" font-weight="400">Just when it seemed like the Claude Code world couldn&#39;t get</tspan><tspan x="16" y="236" font-size="12" font-weight="400">any Ralph-ier, a fascinating research paper has caught</tspan><tspan x="16" y="252" font-size="12" font-weight="400">the attention of engineers - known simply as</tspan><tspan x="16" y="268" font-size="12" font-weight="400">&quot;The Guy Pearce From Memento&quot; technique, it claims</tspan><tspan x="16" y="284" font-size="12" font-weight="400">to achieve remarkable results by leveraging agents who are</tspan><tspan x="16" y="300" font-size="12" font-weight="400">completely unable to form short term memories at all,</tspan><tspan x="16" y="316" font-size="12" font-weight="400">relying instead on tattoos to preserve critical information.</tspan></text><line x1="16" y1="324" x2="404" y2="324" stroke="#1A1A1A" stroke-width="0.6"/><text x="16" y="346" font-family="Georgia, serif" font-size="12" fill="#1A1A1A" font-weight="700" letter-spacing="2">MORE NEWS</text><line x1="16" y1="356" x2="404" y2="356" stroke="#1A1A1A" stroke-width="0.3"/><text x="16" y="376" font-family="Georgia, serif" font-size="13" fill="#0F0F0F" font-weight="700">The Memento Moment</text><text x="16" y="390" font-family="Georgia, serif" font-size="10" fill="#5A5A5A" font-style="italic">great movie · so cool</text><text font-family="Georgia, serif" font-size="12" fill="#2A2A2A"><tspan x="16" y="408" font-size="12" font-weight="400">Engineers at the stealth company that published the paper</tspan><tspan x="16" y="426" font-size="12" font-weight="400">told us that the big moment came when they decided</tspan><tspan x="16" y="444" font-size="12" font-weight="400">to remove the agents&#39; storage and replace it with tattoo guns.</tspan></text><line x1="16" y1="457.7" x2="404" y2="457.7" stroke="#9A9A9A" stroke-width="0.3" stroke-dasharray="2,2"/><text x="16" y="478" font-family="Georgia, serif" font-size="14" fill="#0F0F0F" font-weight="700">A New Paradigm?</text><text x="16" y="492" font-family="Georgia, serif" font-size="10" fill="#5A5A5A" font-style="italic">doubtful</text><text font-family="Georgia, serif" font-size="12" fill="#2A2A2A"><tspan x="16" y="510" font-size="12" font-weight="400">It&#39;s hard to remember what software engineering</tspan><tspan x="16" y="528" font-size="12" font-weight="400">was like before Ralph Wiggum came along...</tspan><tspan x="16" y="546" font-size="12" font-weight="400">Actually that&#39;s kind of like Guy Pearce in Memento.</tspan></text><line x1="16" y1="554.6" x2="404" y2="554.6" stroke="#9A9A9A" stroke-width="0.3" stroke-dasharray="2,2"/><text x="16" y="572.9" font-family="Georgia, serif" font-size="14" fill="#0F0F0F" font-weight="700">&quot;It&#39;ll Never Go Viral&quot;</text><text x="16" y="586.9" font-family="Georgia, serif" font-size="10" fill="#5A5A5A" font-style="italic">good point</text><text font-family="Georgia, serif" font-size="10" fill="#2A2A2A"><tspan x="16" y="604.9" font-size="12" font-weight="400">Critics have argued that despite its undeniable superiority compared</tspan><tspan x="16" y="620.9" font-size="12" font-weight="400">to existing paradigms, the fact that nobody can remember</tspan><tspan x="16" y="636.9" font-size="12" font-weight="400">the name of the Memento protagonist means it&#39;s destined to fail.</tspan></text><line x1="16" y1="644" x2="404" y2="644" stroke="#1A1A1A" stroke-width="0.6"/><text x="16" y="666" font-family="Georgia, serif" font-size="12" fill="#1A1A1A" font-weight="700" letter-spacing="2">THIS PART</text><line x1="16" y1="678" x2="404" y2="678" stroke="#1A1A1A" stroke-width="0.3"/><text font-family="'Old Standard TT', Georgia, serif" fill="#0F0F0F" font-weight="700"><tspan x="16" y="702" font-size="18" font-weight="700">GitHub Profile</tspan><tspan x="16" y="726" font-size="18" font-weight="700">Activity Newsletter</tspan></text><text x="16" y="746" font-family="Georgia, serif" font-size="10" fill="#5A5A5A" font-style="italic">a fun new project</text><line x1="16" y1="756" x2="404" y2="756" stroke="#6A6A6A" stroke-width="0.3"/><text font-family="Georgia, serif" font-size="10" fill="#2A2A2A"><tspan x="16" y="774" font-size="12" font-weight="400">An engaging new take on GitHub profile stats</tspan><tspan x="16" y="789" font-size="12" font-weight="400">combines realtime activity with a vintage aesthetic</tspan><tspan x="16" y="804" font-size="12" font-weight="400">that feels right out of a black-and-white movie.</tspan></text><rect x="16" y="817" width="388" height="112" fill="none" stroke="#1A1A1A" stroke-width="0.5"/><rect x="16" y="817" width="388" height="18" fill="#1A1A1A"/><text x="210" y="830" font-family="Georgia, serif" font-size="12" fill="#E0DCD7" font-weight="700" text-anchor="middle" letter-spacing="2">IN BRIEF</text><text x="26" y="857" font-family="Georgia, serif" font-size="12" fill="#2A2A2A"><tspan font-weight="600">pre-vhs.</tspan> 0 new stars</text><text x="26" y="875" font-family="Georgia, serif" font-size="12" fill="#2A2A2A"><tspan font-weight="600">GITHUB-GPG-BADGE</tspan>. new release coming soon</text><text x="26" y="893" font-family="Georgia, serif" font-size="12" fill="#2A2A2A"><tspan font-weight="600">MY-PGP-INBOX</tspan>. new release coming soon</text><text x="26" y="911" font-family="Georgia, serif" font-size="12" fill="#2A2A2A"><tspan font-weight="600">Awesome Claude Code</tspan>. Not accepting crypto stuff right now</text><line x1="16" y1="937" x2="404" y2="937" stroke="#1A1A1A" stroke-width="0.5"/><line x1="16" y1="940" x2="404" y2="940" stroke="#1A1A1A" stroke-width="1.5"/><text x="16" y="957" font-family="Georgia, serif" font-size="12" fill="#5A5A5A">Strictly satire and a bit of playful fun.</text><text x="404" y="957" font-family="Georgia, serif" font-size="12" fill="#5A5A5A" text-anchor="end"></text><rect width="420" height="980" fill="url(#cornerTL)"/><rect width="420" height="980" fill="url(#cornerBR)"/></svg>
