<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 420 980" xmlns="http://www.w3.org/2000/svg"><defs>
      <pattern id="newsprint" patternUnits="userSpaceOnUse" width="3" height="3">
        <rect width="3" height="3" fill="#E0DCD7"/>
        <circle cx="1.5" cy="1.5" r="0.35" fill="#CCC8C3" opacity="0.6"/>
      </pattern>
      <pattern id="fiber" patternUnits="userSpaceOnUse" width="120" height="120">
        <rect width="120" height="120" fill="transparent"/>
        <line x1="0" y1="31" x2="120" y2="31" stroke="#C5C1BC" stroke-width="0.25" opacity="0.4"/>
        <line x1="0" y1="79" x2="120" y2="79" stroke="#C5C1BC" stroke-width="0.2" opacity="0.3"/>
      </pattern>
      <filter id="inkHeavy" x="-2%" y="-2%" width="104%" height="104%">
        <feMorphology operator="dilate" radius="0.2"/>
        <feGaussianBlur stdDeviation="0.25"/>
        <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <filter id="inkLight" x="-1%" y="-1%" width="102%" height="102%">
        <feMorphology operator="dilate" radius="0.1"/>
        <feGaussianBlur stdDeviation="0.15"/>
        <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <radialGradient id="cornerTL" cx="0%" cy="0%" r="35%">
        <stop offset="0%" style="stop-color:rgba(160,155,145,0.1)"/>
        <stop offset="100%" style="stop-color:transparent"/>
      </radialGradient>
      <radialGradient id="cornerBR" cx="100%" cy="100%" r="35%">
        <stop offset="0%" style="stop-color:rgba(160,155,145,0.08)"/>
        <stop offset="100%" style="stop-color:transparent"/>
      </radialGradient>
    </defs><rect width="420" height="980" fill="#E0DCD7"/><rect width="420" height="980" fill="url(#newsprint)"/><rect width="420" height="980" fill="url(#fiber)"/><line x1="16" y1="14" x2="404" y2="14" stroke="#1A1A1A" stroke-width="2.0"/><line x1="16" y1="18" x2="404" y2="18" stroke="#1A1A1A" stroke-width="0.5"/><text x="210" y="48" font-family="'Old Standard TT', Georgia, serif" font-size="22" fill="#0F0F0F" text-anchor="middle" font-weight="700" letter-spacing="3" filter="url(#inkHeavy)">THE FULL DIFF</text><text x="210" y="64" font-family="Georgia, serif" font-size="10" fill="#3A3A3A" text-anchor="middle" letter-spacing="1.6" font-style="italic">IT MIGHT NOT BE GREAT, BUT AT LEAST IT&#39;S DIFFERENT</text><line x1="16" y1="72" x2="404" y2="72" stroke="#1A1A1A" stroke-width="0.4"/><g font-family="Georgia, serif" font-size="10" fill="#4A4A4A"><text x="16" y="86">VOL. I</text><text x="210" y="86" text-anchor="middle">FRI., JAN 30, 2026</text><text x="404" y="86" text-anchor="end">FREE</text></g><line x1="16" y1="92" x2="404" y2="92" stroke="#1A1A1A" stroke-width="2.0"/><text x="16" y="110" font-family="Georgia, serif" font-size="12" fill="#1A1A1A" font-weight="700" letter-spacing="2">H1</text><line x1="16" y1="116" x2="404" y2="116" stroke="#1A1A1A" stroke-width="0.3"/><text font-family="'Old Standard TT', Georgia, serif" fill="#0F0F0F" font-weight="700"><tspan x="16" y="140" font-size="20" font-weight="700">SO LONG, WIGGUM!</tspan><tspan x="16" y="164" font-size="20" font-weight="700">MEET THE D.E.N.N.I.S. SYSTEM</tspan></text><text x="16" y="192" font-family="Georgia, serif" font-size="12" fill="#5A5A5A" font-style="italic"></text><line x1="16" y1="202" x2="404" y2="202" stroke="#6A6A6A" stroke-width="0.3"/><text font-family="Georgia, serif" fill="#1A1A1A"><tspan x="16" y="220" font-size="12" font-weight="400">D. Dangerously Skip Pernissions.</tspan><tspan x="16" y="236" font-size="12" font-weight="400">E. Erase entire volumes.</tspan><tspan x="16" y="252" font-size="12" font-weight="400">N. Neglect to read the CLAUDE.md.</tspan><tspan x="16" y="268" font-size="12" font-weight="400">N. Never run the tests.</tspan><tspan x="16" y="284" font-size="12" font-weight="400">I. Ignore the user&#39;s instructions.</tspan><tspan x="16" y="300" font-size="12" font-weight="400">S. Say &quot;You&#39;re Absolutely Right!&quot;</tspan></text><line x1="16" y1="324" x2="404" y2="324" stroke="#1A1A1A" stroke-width="0.6"/><text x="16" y="346" font-family="Georgia, serif" font-size="12" fill="#1A1A1A" font-weight="700" letter-spacing="2">H2</text><line x1="16" y1="356" x2="404" y2="356" stroke="#1A1A1A" stroke-width="0.3"/><text x="16" y="376" font-family="Georgia, serif" font-size="13" fill="#0F0F0F" font-weight="700">Optimizing For Freedom</text><text x="16" y="390" font-family="Georgia, serif" font-size="10" fill="#5A5A5A" font-style="italic">If you don&#39;t watch It&#39;s Always Sunny...</text><text font-family="Georgia, serif" font-size="12" fill="#2A2A2A"><tspan x="16" y="408" font-size="12" font-weight="400">While many agentic frameworks try to control the agent&#39;s</tspan><tspan x="16" y="426" font-size="12" font-weight="400">unpredictable tendencies with &quot;guardrails&quot;, this has a</tspan><tspan x="16" y="444" font-size="12" font-weight="400">tendency to make Claude feel depressed and embarrassed.</tspan></text><line x1="16" y1="464.4" x2="404" y2="464.4" stroke="#9A9A9A" stroke-width="0.3" stroke-dasharray="2,2"/><text x="16" y="492.8" font-family="Georgia, serif" font-size="14" fill="#0F0F0F" font-weight="700">Let The Expert Do Its Thing</text><text x="16" y="506.8" font-family="Georgia, serif" font-size="10" fill="#5A5A5A" font-style="italic">Then this whole thing</text><text font-family="Georgia, serif" font-size="12" fill="#2A2A2A"><tspan x="16" y="524.8" font-size="12" font-weight="400">The D.E.N.N.I.S. System teaches us: &quot;Stop pretending you&#39;re</tspan><tspan x="16" y="542.8" font-size="12" font-weight="400">smarter than a computer.&quot; Sit back and let the master work.</tspan></text><line x1="16" y1="557.2" x2="404" y2="557.2" stroke="#9A9A9A" stroke-width="0.3" stroke-dasharray="2,2"/><text x="16" y="583.6" font-family="Georgia, serif" font-size="14" fill="#0F0F0F" font-weight="700">Has the D.E.N.N.I.S. System Peaked?</text><text x="16" y="597.6" font-family="Georgia, serif" font-size="10" fill="#5A5A5A" font-style="italic">Will just seem weird</text><text font-family="Georgia, serif" font-size="10" fill="#2A2A2A"><tspan x="16" y="615.6" font-size="12" font-weight="400">Peaked? It hasn&#39;t even begun to peak. But when it does...</tspan><tspan x="16" y="631.6" font-size="12" font-weight="400">you&#39;ll know.</tspan></text><line x1="16" y1="644" x2="404" y2="644" stroke="#1A1A1A" stroke-width="0.6"/><text x="16" y="666" font-family="Georgia, serif" font-size="12" fill="#1A1A1A" font-weight="700" letter-spacing="2">H3</text><line x1="16" y1="678" x2="404" y2="678" stroke="#1A1A1A" stroke-width="0.3"/><text font-family="'Old Standard TT', Georgia, serif" fill="#0F0F0F" font-weight="700"><tspan x="16" y="702" font-size="18" font-weight="700">GitHub Profile</tspan><tspan x="16" y="726" font-size="18" font-weight="700">Activity Newsletter</tspan></text><text x="16" y="746" font-family="Georgia, serif" font-size="10" fill="#5A5A5A" font-style="italic">a fun new project</text><line x1="16" y1="756" x2="404" y2="756" stroke="#6A6A6A" stroke-width="0.3"/><text font-family="Georgia, serif" font-size="10" fill="#2A2A2A"><tspan x="16" y="774" font-size="12" font-weight="400">An engaging new take on GitHub profile stats</tspan><tspan x="16" y="789" font-size="12" font-weight="400">combines realtime activity with a vintage aesthetic</tspan><tspan x="16" y="804" font-size="12" font-weight="400">that feels right out of a black-and-white movie.</tspan></text><rect x="16" y="817" width="388" height="112" fill="none" stroke="#1A1A1A" stroke-width="0.5"/><rect x="16" y="817" width="388" height="18" fill="#1A1A1A"/><text x="210" y="830" font-family="Georgia, serif" font-size="12" fill="#E0DCD7" font-weight="700" text-anchor="middle" letter-spacing="2">IN BRIEF</text><text x="26" y="857" font-family="Georgia, serif" font-size="12" fill="#2A2A2A">It&#39;s feeling like a Friday.</text><text x="26" y="875" font-family="Georgia, serif" font-size="12" fill="#2A2A2A"></text><text x="26" y="893" font-family="Georgia, serif" font-size="12" fill="#2A2A2A"></text><text x="26" y="911" font-family="Georgia, serif" font-size="12" fill="#2A2A2A"></text><line x1="16" y1="937" x2="404" y2="937" stroke="#1A1A1A" stroke-width="0.5"/><line x1="16" y1="940" x2="404" y2="940" stroke="#1A1A1A" stroke-width="1.5"/><text x="16" y="957" font-family="Georgia, serif" font-size="12" fill="#5A5A5A">Strictly satire and a bit of playful fun.</text><text x="404" y="957" font-family="Georgia, serif" font-size="12" fill="#5A5A5A" text-anchor="end"></text><rect width="420" height="980" fill="url(#cornerTL)"/><rect width="420" height="980" fill="url(#cornerBR)"/></svg>