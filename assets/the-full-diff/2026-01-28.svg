<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 420 980" xmlns="http://www.w3.org/2000/svg"><defs>
      <pattern id="newsprint" patternUnits="userSpaceOnUse" width="3" height="3">
        <rect width="3" height="3" fill="#E0DCD7"/>
        <circle cx="1.5" cy="1.5" r="0.35" fill="#CCC8C3" opacity="0.6"/>
      </pattern>
      <pattern id="fiber" patternUnits="userSpaceOnUse" width="120" height="120">
        <rect width="120" height="120" fill="transparent"/>
        <line x1="0" y1="31" x2="120" y2="31" stroke="#C5C1BC" stroke-width="0.25" opacity="0.4"/>
        <line x1="0" y1="79" x2="120" y2="79" stroke="#C5C1BC" stroke-width="0.2" opacity="0.3"/>
      </pattern>
      <filter id="inkHeavy" x="-2%" y="-2%" width="104%" height="104%">
        <feMorphology operator="dilate" radius="0.2"/>
        <feGaussianBlur stdDeviation="0.25"/>
        <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <filter id="inkLight" x="-1%" y="-1%" width="102%" height="102%">
        <feMorphology operator="dilate" radius="0.1"/>
        <feGaussianBlur stdDeviation="0.15"/>
        <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <radialGradient id="cornerTL" cx="0%" cy="0%" r="35%">
        <stop offset="0%" style="stop-color:rgba(160,155,145,0.1)"/>
        <stop offset="100%" style="stop-color:transparent"/>
      </radialGradient>
      <radialGradient id="cornerBR" cx="100%" cy="100%" r="35%">
        <stop offset="0%" style="stop-color:rgba(160,155,145,0.08)"/>
        <stop offset="100%" style="stop-color:transparent"/>
      </radialGradient>
    </defs><rect width="420" height="980" fill="#E0DCD7"/><rect width="420" height="980" fill="url(#newsprint)"/><rect width="420" height="980" fill="url(#fiber)"/><line x1="16" y1="14" x2="404" y2="14" stroke="#1A1A1A" stroke-width="2.0"/><line x1="16" y1="18" x2="404" y2="18" stroke="#1A1A1A" stroke-width="0.5"/><text x="210" y="48" font-family="'Old Standard TT', Georgia, serif" font-size="22" fill="#0F0F0F" text-anchor="middle" font-weight="700" letter-spacing="3" filter="url(#inkHeavy)">THE FULL DIFF</text><text x="210" y="64" font-family="Georgia, serif" font-size="10" fill="#3A3A3A" text-anchor="middle" letter-spacing="1.6" font-style="italic">IT MIGHT NOT BE GREAT, BUT MY INTERNET WENT OUT</text><line x1="16" y1="72" x2="404" y2="72" stroke="#1A1A1A" stroke-width="0.4"/><g font-family="Georgia, serif" font-size="10" fill="#4A4A4A"><text x="16" y="86">VOL. I</text><text x="210" y="86" text-anchor="middle">WED., JAN 28, 2026</text><text x="404" y="86" text-anchor="end">FREE</text></g><line x1="16" y1="92" x2="404" y2="92" stroke="#1A1A1A" stroke-width="2.0"/><text x="16" y="110" font-family="Georgia, serif" font-size="12" fill="#1A1A1A" font-weight="700" letter-spacing="2">H1</text><line x1="16" y1="116" x2="404" y2="116" stroke="#1A1A1A" stroke-width="0.3"/><text font-family="'Old Standard TT', Georgia, serif" fill="#0F0F0F" font-weight="700"><tspan x="16" y="140" font-size="20" font-weight="700">REALLY HIM -</tspan><tspan x="16" y="164" font-size="20" font-weight="700">REPO RAMPAGE</tspan></text><text x="16" y="192" font-family="Georgia, serif" font-size="12" fill="#5A5A5A" font-style="italic">wow · damn fr?</text><line x1="16" y1="202" x2="404" y2="202" stroke="#6A6A6A" stroke-width="0.3"/><text font-family="Georgia, serif" fill="#1A1A1A"><tspan x="16" y="220" font-size="12" font-weight="400">Reclusive maintainer &quot;Really Him&quot; (ridiculous alias)</tspan><tspan x="16" y="236" font-size="12" font-weight="400">is on a desperate mission to regain credibility</tspan><tspan x="16" y="252" font-size="12" font-weight="400">after failing to update profile README for a week.</tspan><tspan x="16" y="268" font-size="12" font-weight="400">It seems that since our last report, numerous libraries have</tspan><tspan x="16" y="284" font-size="12" font-weight="400">received a major version bump, several resources have been</tspan><tspan x="16" y="300" font-size="12" font-weight="400">added to Awesome Claude Code, and late last night</tspan><tspan x="16" y="316" font-size="12" font-weight="400">it&#39;s reported that two MORE repositories have been published</tspan><tspan x="16" y="332" font-size="12" font-weight="400">by the developer that many users described as &quot;Who?&quot; when questioned.</tspan></text><line x1="16" y1="340" x2="404" y2="340" stroke="#1A1A1A" stroke-width="0.6"/><text x="16" y="362" font-family="Georgia, serif" font-size="12" fill="#1A1A1A" font-weight="700" letter-spacing="2">BREAKING CHARACTER</text><line x1="16" y1="372" x2="404" y2="372" stroke="#1A1A1A" stroke-width="0.3"/><text x="16" y="392" font-family="Georgia, serif" font-size="13" fill="#0F0F0F" font-weight="700">github-api-usage-tracker</text><text x="16" y="406" font-family="Georgia, serif" font-size="10" fill="#5A5A5A" font-style="italic"></text><text font-family="Georgia, serif" font-size="12" fill="#2A2A2A"><tspan x="16" y="424" font-size="12" font-weight="400">I realized the whole design for this GitHub action was</tspan><tspan x="16" y="442" font-size="12" font-weight="400">untenable because of the fact that the GitHub REST API</tspan><tspan x="16" y="460" font-size="12" font-weight="400">Search endpoint has a 60-second reset, so I had to write it again.</tspan></text><line x1="16" y1="474.1" x2="404" y2="474.1" stroke="#9A9A9A" stroke-width="0.3" stroke-dasharray="2,2"/><text x="16" y="495" font-family="Georgia, serif" font-size="14" fill="#0F0F0F" font-weight="700">git-miscellany</text><text x="16" y="509" font-family="Georgia, serif" font-size="10" fill="#5A5A5A" font-style="italic"></text><text font-family="Georgia, serif" font-size="12" fill="#2A2A2A"><tspan x="16" y="527" font-size="12" font-weight="400">Just decided I&#39;d share some of my little git</tspan><tspan x="16" y="545" font-size="12" font-weight="400">shell functions and aliases that make life so special.</tspan></text><line x1="16" y1="555" x2="404" y2="555" stroke="#9A9A9A" stroke-width="0.3" stroke-dasharray="2,2"/><text x="16" y="573.9" font-family="Georgia, serif" font-size="14" fill="#0F0F0F" font-weight="700">Robot In The Loop (RITL)</text><text x="16" y="587.9" font-family="Georgia, serif" font-size="10" fill="#5A5A5A" font-style="italic"></text><text font-family="Georgia, serif" font-size="10" fill="#2A2A2A"><tspan x="16" y="605.9" font-size="12" font-weight="400">RITL is a new badge I made to show some appreciation for</tspan><tspan x="16" y="621.9" font-size="12" font-weight="400">the Lovable Little Minions I pay to write code for me.</tspan><tspan x="16" y="637.9" font-size="12" font-weight="400">What&#39;s cool about badges is you can just make your own.</tspan></text><line x1="16" y1="645.2" x2="404" y2="645.2" stroke="#1A1A1A" stroke-width="0.6"/><text x="16" y="667.2" font-family="Georgia, serif" font-size="12" fill="#1A1A1A" font-weight="700" letter-spacing="2">H3</text><line x1="16" y1="679.2" x2="404" y2="679.2" stroke="#1A1A1A" stroke-width="0.3"/><text font-family="'Old Standard TT', Georgia, serif" fill="#0F0F0F" font-weight="700"><tspan x="16" y="703.2" font-size="18" font-weight="700">GitHub Profile</tspan><tspan x="16" y="727.2" font-size="18" font-weight="700">Activity Newsletter</tspan></text><text x="16" y="747.2" font-family="Georgia, serif" font-size="10" fill="#5A5A5A" font-style="italic">a fun new project</text><line x1="16" y1="757.2" x2="404" y2="757.2" stroke="#6A6A6A" stroke-width="0.3"/><text font-family="Georgia, serif" font-size="10" fill="#2A2A2A"><tspan x="16" y="775.2" font-size="12" font-weight="400">An engaging new take on GitHub profile stats</tspan><tspan x="16" y="790.2" font-size="12" font-weight="400">combines realtime activity with a vintage aesthetic</tspan><tspan x="16" y="805.2" font-size="12" font-weight="400">that feels right out of a black-and-white movie.</tspan></text><rect x="16" y="817" width="388" height="112" fill="none" stroke="#1A1A1A" stroke-width="0.5"/><rect x="16" y="817" width="388" height="18" fill="#1A1A1A"/><text x="210" y="830" font-family="Georgia, serif" font-size="12" fill="#E0DCD7" font-weight="700" text-anchor="middle" letter-spacing="2">IN BRIEF</text><text x="26" y="857" font-family="Georgia, serif" font-size="12" fill="#2A2A2A">Repos. 2 public repos created</text><text x="26" y="875" font-family="Georgia, serif" font-size="12" fill="#2A2A2A">Releases. Another release for pre-vhs</text><text x="26" y="893" font-family="Georgia, serif" font-size="12" fill="#2A2A2A">Actions. New action release coming soon</text><text x="26" y="911" font-family="Georgia, serif" font-size="12" fill="#2A2A2A">Awesome Claude Code. 5-6 new resources added(?)</text><line x1="16" y1="937" x2="404" y2="937" stroke="#1A1A1A" stroke-width="0.5"/><line x1="16" y1="940" x2="404" y2="940" stroke="#1A1A1A" stroke-width="1.5"/><text x="16" y="957" font-family="Georgia, serif" font-size="12" fill="#5A5A5A">Strictly satire and a bit of playful fun.</text><text x="404" y="957" font-family="Georgia, serif" font-size="12" fill="#5A5A5A" text-anchor="end"></text><rect width="420" height="980" fill="url(#cornerTL)"/><rect width="420" height="980" fill="url(#cornerBR)"/></svg>
