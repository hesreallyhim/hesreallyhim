<?xml version="1.0" encoding="UTF-8"?>
<svg width="900" height="420" viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="starlight-credits contributor credits">
  <defs>
    <linearGradient id="gcBackdrop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#15100c"/>
      <stop offset="34%" stop-color="#090a0f"/>
      <stop offset="100%" stop-color="#040406"/>
    </linearGradient>
    <radialGradient id="gcTopGlow" cx="50%" cy="0%" r="78%">
      <stop offset="0%" stop-color="#f2d56b" stop-opacity="0.24"/>
      <stop offset="42%" stop-color="#8ee6c8" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#050505" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gcEdgeLight" x1="0" y1="0" x2="1" y2="0">
