    <mask id="gcFadeMask" maskUnits="userSpaceOnUse" x="0" y="0" width="900" height="420">
      <rect x="0" y="0" width="900" height="420" fill="black"/>
      <rect x="0" y="64" width="900" height="292" fill="url(#gcFade)"/>
    </mask>
  </defs>

  <rect width="100%" height="100%" rx="20" fill="url(#gcBackdrop)"/>
